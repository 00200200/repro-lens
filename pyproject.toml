[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "repro-lens"
version = "0.3.0"
description = "Evidence-based reproducibility checks for ML projects and coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
repro-lens = "repro_lens.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.12,<1", "pre-commit>=4,<5", "pyyaml>=6,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/repro_lens"]

[tool.hatch.build.targets.wheel.force-include]
"templates/sklearn" = "repro_lens/templates/sklearn"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.repro-lens]
exclude = ["examples/broken/**", "templates/**"]
required-files = ["pyproject.toml", "uv.lock", "docs/rules.md"]

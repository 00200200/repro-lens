<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" font-size="15" role="img" aria-label="repro-lens check flags train_test_split without random_state as R101">
  <style>
    text{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;fill:#c9d1d9}
    .dim{fill:#8b949e}.r{fill:#f85149}.b{fill:#58a6ff}.t{fill:#64dfcf}.y{fill:#d29922}
    #c1,#c2,#c3,#c4,#c5,#c6{animation:reveal 10s infinite}
    #c1{animation-name:r1}#c2{animation-name:r2}#c3{animation-name:r3}
    #c4{animation-name:r4}#c5{animation-name:r5}#c6{animation-name:r6}
    @keyframes r1{0%,2%{opacity:0}4%,96%{opacity:1}100%{opacity:0}}
    @keyframes r2{0%,14%{opacity:0}16%,96%{opacity:1}100%{opacity:0}}
    @keyframes r3{0%,26%{opacity:0}28%,96%{opacity:1}100%{opacity:0}}
    @keyframes r4{0%,40%{opacity:0}42%,96%{opacity:1}100%{opacity:0}}
    @keyframes r5{0%,54%{opacity:0}56%,96%{opacity:1}100%{opacity:0}}
    @keyframes r6{0%,68%{opacity:0}70%,96%{opacity:1}100%{opacity:0}}
    .cur{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
  </style>
  <rect x="6" y="6" width="808" height="288" rx="10" fill="#0d1117" stroke="#30363d"/>
  <rect x="6" y="6" width="808" height="36" rx="10" fill="#161b22"/>
  <rect x="6" y="30" width="808" height="12" fill="#161b22"/>
  <circle cx="28" cy="24" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="24" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="24" r="6" fill="#27c93f"/>
  <text x="410" y="29" text-anchor="middle" class="dim">repro-lens check &#183; no ML imports, no API key</text>

  <text id="c1" x="26" y="78"><tspan class="dim">$</tspan> repro-lens check --root /path/to/project</text>
  <text id="c2" x="26" y="114" class="t">Repro Lens &#8212; 1 Python files and notebooks checked</text>
  <text id="c3" x="26" y="142" class="dim">Static screening only; experiment repeatability has not been tested.</text>
  <text id="c4" x="26" y="180"><tspan class="b">split.py:3:1</tspan> <tspan class="y">R101</tspan> <tspan class="r">[warning]</tspan></text>
  <text id="c5" x="26" y="208">sklearn.model_selection.train_test_split has no explicit non-None random_state.</text>
  <text id="c6" x="26" y="236" class="dim">  Pass the experiment's seed/RNG, or document intentional upstream RNG control.</text>

  <text x="26" y="272"><tspan class="dim">$</tspan> <tspan class="cur">&#9612;</tspan></text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" width="820" height="340" font-size="15" role="img" aria-label="The agent-review demo: a refactor matches the baseline, a changed threshold mismatches, and a changed tolerance needs separate review">
  <style>
    text{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;fill:#c9d1d9}
    .dim{fill:#8b949e}.g{fill:#3fb950}.r{fill:#f85149}.b{fill:#58a6ff}.t{fill:#64dfcf}.y{fill:#d29922}
    #l1,#l2,#l3,#l4,#l5,#l6,#l7{animation:reveal 11s infinite}
    #l1{animation-name:r1}#l2{animation-name:r2}#l3{animation-name:r3}#l4{animation-name:r4}
    #l5{animation-name:r5}#l6{animation-name:r6}#l7{animation-name:r7}
    @keyframes r1{0%,2%{opacity:0}4%,96%{opacity:1}100%{opacity:0}}
    @keyframes r2{0%,12%{opacity:0}14%,96%{opacity:1}100%{opacity:0}}
    @keyframes r3{0%,22%{opacity:0}24%,96%{opacity:1}100%{opacity:0}}
    @keyframes r4{0%,32%{opacity:0}34%,96%{opacity:1}100%{opacity:0}}
    @keyframes r5{0%,42%{opacity:0}44%,96%{opacity:1}100%{opacity:0}}
    @keyframes r6{0%,52%{opacity:0}54%,96%{opacity:1}100%{opacity:0}}
    @keyframes r7{0%,64%{opacity:0}66%,96%{opacity:1}100%{opacity:0}}
    .cur{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
  </style>
  <rect x="6" y="6" width="808" height="328" rx="10" fill="#0d1117" stroke="#30363d"/>
  <rect x="6" y="6" width="808" height="36" rx="10" fill="#161b22"/>
  <rect x="6" y="30" width="808" height="12" fill="#161b22"/>
  <circle cx="28" cy="24" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="24" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="24" r="6" fill="#27c93f"/>
  <text x="410" y="29" text-anchor="middle" class="dim">repro-lens &#183; examples/agent_review/demo.py</text>

  <text id="l1" x="26" y="78"><tspan class="dim">$</tspan> uv run --no-dev python examples/agent_review/demo.py</text>
  <text id="l2" x="26" y="118" class="dim">Scenario             verify     compare with baseline</text>
  <text id="l3" x="26" y="148">baseline             <tspan class="t">matched</tspan>    -</text>
  <text id="l4" x="26" y="178">refactor             <tspan class="t">matched</tspan>    <tspan class="g">matched</tspan></text>
  <text id="l5" x="26" y="208">changed threshold    <tspan class="t">matched</tspan>    <tspan class="r">mismatch</tspan></text>
  <text id="l6" x="26" y="238">changed tolerance    <tspan class="t">matched</tspan>    <tspan class="y">not_comparable</tspan></text>
  <text id="l7" x="26" y="278" class="dim">Evidence: .repro-lens/agent-demo/&#8230;/summary.json</text>

  <text x="26" y="314"><tspan class="dim">$</tspan> <tspan class="cur">&#9612;</tspan></text>
</svg>

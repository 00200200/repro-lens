name: Checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run repro-lens check
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv build
      - name: Validate the before/after demo
        run: uv run python examples/agent_review/demo.py
      - name: Validate framework screening examples
        run: uv run --no-dev python examples/framework_checks/demo.py
      - name: Validate a generated experiment
        run: |
          uv run repro-lens init /tmp/repro-lens-example --name ci_experiment
          uv sync --project /tmp/repro-lens-example --locked
          uv run --project /tmp/repro-lens-example pytest /tmp/repro-lens-example/tests
          uv run repro-lens check --root /tmp/repro-lens-example
          uv run repro-lens verify --root /tmp/repro-lens-example
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: evidence-${{ matrix.python }}
          path: |
            /tmp/repro-lens-example/.repro-lens/
            .repro-lens/agent-demo/
            .repro-lens/framework-demo.json
          include-hidden-files: true
  sklearn-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: '3.11'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python examples/sklearn_review/demo.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sklearn-replay-evidence
          path: |
            .repro-lens/sklearn-demo/
            !.repro-lens/sklearn-demo/**/.venv/**
          include-hidden-files: true
  xgboost-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: '3.11'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python examples/xgboost_review/demo.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: xgboost-replay-evidence
          path: |
            .repro-lens/xgboost-demo/
            !.repro-lens/xgboost-demo/**/.venv/**
          include-hidden-files: true
  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: '3.11'
          enable-cache: true
      - run: uv sync --locked --no-dev
      - run: uv run --no-dev python tools/build_gallery.py
      - name: Add the pinned Python runtime
        run: uv run --no-dev python tools/fetch_pyodide.py
      - name: Check the built browser engine
        run: node tools/smoke_live_checker.mjs dist/gallery
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/gallery
  deploy-gallery:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test, sklearn-replay, xgboost-replay, gallery]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the checked gallery
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

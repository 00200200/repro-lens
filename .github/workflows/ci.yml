name: Checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run repro-lens check
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv build
      - name: Validate the before/after demo
        run: uv run python examples/agent_review/demo.py
      - name: Validate framework screening examples
        run: uv run --no-dev python examples/framework_checks/demo.py
      - name: Validate a generated experiment
        run: |
          uv run repro-lens init /tmp/repro-lens-example --name ci_experiment
          uv sync --project /tmp/repro-lens-example --locked
          uv run --project /tmp/repro-lens-example pytest /tmp/repro-lens-example/tests
          uv run repro-lens check --root /tmp/repro-lens-example
          uv run repro-lens verify --root /tmp/repro-lens-example
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: evidence-${{ matrix.python }}
          path: |
            /tmp/repro-lens-example/.repro-lens/
            .repro-lens/agent-demo/
            .repro-lens/framework-demo.json
          include-hidden-files: true
  xgboost-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: '3.11'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python examples/xgboost_review/demo.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: xgboost-replay-evidence
          path: |
            .repro-lens/xgboost-demo/
            !.repro-lens/xgboost-demo/**/.venv/**
          include-hidden-files: true
  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: '3.11'
          enable-cache: true
      - run: uv sync --locked --no-dev
      - run: uv run --no-dev python tools/build_gallery.py
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist/gallery
  deploy-gallery:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test, xgboost-replay, gallery]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the checked gallery
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

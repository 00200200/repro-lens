name: PR Reviewer & Quality Gate

on:
  pull_request_target:
    types: [opened, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  welcome-and-verify:
    name: Contributor Welcome & Issue Check
    if: github.actor != 'dependabot[bot]' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR description & welcome contributor
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const body = pr.body || "";

            // Check if PR links an issue
            const issueLinkRegex = /(close[sd]?|fix(es|ed)?|resolve[sd]?)\s+#\d+/i;
            const hasIssueLink = issueLinkRegex.test(body);

            // Fetch comments on this PR to avoid repeat notifications
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number
            });

            const botAlreadyCommented = comments.data.some(c =>
              c.user.login === "github-actions[bot]" && c.body.includes("PR Review Checklist")
            );

            if (botAlreadyCommented) {
              return;
            }

            let message = `### 👋 Thanks for opening this pull request, @${author}!\n\n`;

            if (context.payload.action === 'opened') {
              message += `We're thrilled to have your contribution to **${context.repo.repo}**! Here is a quick checklist to help get your PR merged smoothly:\n\n`;
            } else {
              message += `Here is the automated review checklist for this update:\n\n`;
            }

            message += `- [${hasIssueLink ? "x" : " "}] **Linked Issue**: `;
            if (hasIssueLink) {
              message += `Issue reference detected in PR body. ✅\n`;
            } else {
              message += `⚠️ Please reference the related issue in your description (e.g., \`Fixes #123\` or \`Closes #123\`) so it automatically closes upon merge.\n`;
            }

            message += `- [ ] **Local Verification**: Verify all checks pass locally using \`uv run pytest\` and \`uv run ruff check .\`.\n`;
            message += `- [ ] **Commit Hygiene**: Ensure commit messages follow conventional commit style (\`feat:\`, \`fix:\`, \`docs:\`).\n\n`;
            message += `A maintainer will review your code shortly. Feel free to ping in comments if you have any questions! 🚀`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: message
            });

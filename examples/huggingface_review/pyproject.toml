[project]
name = "huggingface-review-example"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "datasets>=2.18.0",
]

[tool.repro-lens.verify]
command = ["python", "train_reproducible.py"]
inputs = ["train_reproducible.py", "pyproject.toml"]
metrics = []
artifacts = []
timeout = 60
atol = 1e-7
rtol = 1e-5
